[package]
name = "cce-files"
version = "0.1.0"
edition = "2024"

[dependencies]
cce-ui = { git = "https://github.com/lsgalante/cce-ui.git", rev = "cb0a31497bc9b4b131dbbab9f728f44dfc59593e" }
wayland-client = { version = "0.31", features = ["system"] }
calloop = "0.13.0"
chrono = "0.4.44"
tokio = { version = "1", features = ["full"] }
notify = "8.2.0"
image = { version = "0.25.10", features = ["png", "jpeg"] }
log = "0.4"
kdl = "6.7.1"



[dev-dependencies]
serial_test = "3"

[lib]
name = "cce_files"
path = "src/lib.rs"

[[bin]]
name = "cce-files"
path = "src/main.rs"

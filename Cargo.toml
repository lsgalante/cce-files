[package]
name = "cce-files"
version = "0.1.0"
edition = "2024"

[dependencies]
cce-ui = { git = "https://github.com/lsgalante/cce-ui.git", rev = "932f464b74db1ff8da24472d9f56d9e2289b7baa", features = ["graph"] }
wayland-client = { version = "0.31", features = ["system"] }
calloop = "0.13.0"
chrono = "0.4.44"
tokio = { version = "1", features = ["full"] }
notify = "8.2.0"
image = { version = "0.25.10", features = ["png", "jpeg"] }
log = "0.4"
kdl = "6.7.1"

[lints.clippy]
# The toolkit's house style (cce-ui's [lints.clippy]): the paint helpers take
# geometry, colour and paint state piecewise.
too_many_arguments = "allow"

[lib]
name = "cce_files"
path = "src/lib.rs"

[[bin]]
name = "cce-files"
path = "src/main.rs"
